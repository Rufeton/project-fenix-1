name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      POSTGRES_USER: fenix
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: fenix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..12}; do
            curl --fail http://localhost:8080/api/health && exit 0
            sleep 5
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Testear endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "http://localhost:8080/api/tasks",
              timeout=5
          ) as response:
              if response.status != 200:
                  raise SystemExit(
                      f"Unexpected status: {response.status}"
                  )

              data = json.load(response)

              if not isinstance(data, list):
                  raise SystemExit("Expected a JSON list")

              print("Tasks endpoint OK")
          PY

      - name: Parar Servicios
        if: always()
        run: docker compose down

  publish-images:
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Loguearse en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen backend
        run: |
          docker build \
            -t ghcr.io/rufeton/project-fenix-backend:${{ github.sha }} \
            -t ghcr.io/rufeton/project-fenix-backend:latest \
            ./backend

      - name: Push imagen backend
        run: |
          docker push ghcr.io/rufeton/project-fenix-backend:${{ github.sha }}
          docker push ghcr.io/rufeton/project-fenix-backend:latest

      - name: Construir imagen frontend
        run: |
          docker build \
            -t ghcr.io/rufeton/project-fenix-frontend:${{ github.sha }} \
            -t ghcr.io/rufeton/project-fenix-frontend:latest \
            ./frontend

      - name: Push imagen frontend
        run: |
          docker push ghcr.io/rufeton/project-fenix-frontend:${{ github.sha }}
          docker push ghcr.io/rufeton/project-fenix-frontend:latest